name: Testlio
description: >-
  Testlio is a managed software testing and quality assurance company that pairs
  a global, vetted community of expert testers with a testing-management platform
  (powered by its Leo AI Engine) to deliver on-demand manual, automated,
  functional, regression, payments, localization, accessibility, usability, and
  AI testing across web, mobile, streaming, and voice experiences. Founded in
  Estonia and headquartered in Austin, Texas, Testlio is a Techstars-backed
  company serving enterprise engineering and QA teams. It exposes no public REST
  API; the platform integrates with engineering toolchains (Jira, GitHub, Azure
  DevOps, GitLab, TestRail, Xray, Slack, BrowserStack, SauceLabs, Playwright) and
  ships first-party CI/CD integrations, including a CircleCI orb and a Jenkins
  plugin, alongside a documented Trust Center.
